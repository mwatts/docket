[package]
name = "docket"
version = "0.1.0"
edition = "2021"
description = "Task tracking for AI-assisted development"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
glob = "0.3"
colored = "2"
dialoguer = "0.11"
anyhow = "1"
